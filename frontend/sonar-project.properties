sonar.projectKey=IUDXQA-Frontend
sonar.projectName=IUDXQA-Frontend
sonar.projectVersion=1.0

# Source Code
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx

# Exclude generated files from source analysis
sonar.exclusions=**/node_modules/**,**/dist/**

# Exclude entry point and type declarations from coverage
sonar.coverage.exclusions=\
src/main.tsx,\
src/vite-env.d.ts

# Encoding
sonar.sourceEncoding=UTF-8

# SCM
sonar.scm.enabled=true

# Quality Gate
sonar.qualitygate.wait=true

# Host
sonar.host.url=https://sonarqube.slicearrow.com
