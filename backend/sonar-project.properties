sonar.projectKey=IUDXQA-Backend
sonar.projectName=IUDXQA-Backend
sonar.projectVersion=1.0

# Source configuration
# Analysed: src/ (the server) and scripts/ (collection sync utilities). The
# Dockerfile, collections/ (Postman data) and automation-scripts/ (Python cleanup scripts) are excluded.
sonar.sources=.
# report-template.html is a 12 MB generated Newman report and previews/ holds
# generated mail previews: neither is written by hand. data/ is runtime state.
sonar.exclusions=Dockerfile,collections/**,automation-scripts/**,node_modules/**,dist/**,coverage/**,test/**,data/**,previews/**,report-template.html,**/*.postman_collection.json,**/*.postman_environment.json

# Test configuration
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts

# Coverage
# Written by the node --test lcov reporter in the Test and Analyze job.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# The test suite measures src/ only. scripts/ are command-line tools run by hand
# to regenerate collections, so they are scanned for issues but not for coverage.
# collections/ is excluded from analysis entirely (see sonar.exclusions).
sonar.coverage.exclusions=test/**,scripts/**

# Encoding & SCM
sonar.sourceEncoding=UTF-8
sonar.scm.enabled=true

# Quality Gate
# TEMPORARY: off. The pipeline fails on overall coverage below 80% instead
# (see "Check overall coverage" in the workflow). With this on, the scanner
# would also fail on every other quality gate condition.
# sonar.qualitygate.wait=true
