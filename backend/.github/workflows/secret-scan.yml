name: Secret Scan

# Fails on any secret in the pushed commits (content and messages) or in the
# files at the pushed commit. Runs on its own for the branches and pull
# requests deploy.yaml does not cover, and deploy.yaml calls it as the gate in
# front of its jobs.
on:
  push:
    branches-ignore:
      - neuman
  pull_request:
    branches-ignore:
      - neuman
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: arc-runner-mal
    env:
      # Pinned: an unpinned scanner turns "a new release added a rule" into a
      # red build on an untouched branch. Rules live in .gitleaks.toml.
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
      GITLEAKS_FLAGS: --ignore-gitleaks-allow --max-archive-depth 3 --redact --verbose --no-banner --exit-code 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Rules come from the base commit, not from the change under test: a pull
      # request cannot loosen .gitleaks.toml or .gitleaksignore and add the
      # secret they would hide in the same change. Rule changes take effect
      # once merged. Only a base without .gitleaks.toml (this file's first
      # pull request) uses the change's own rules.
      - name: Determine commit range and rules
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"; HEAD="$PR_HEAD_SHA"
          else
            HEAD="$PUSH_SHA"
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              BASE="$BEFORE_SHA"
            elif git rev-parse -q --verify origin/dev >/dev/null; then
              BASE=$(git merge-base origin/dev "$HEAD") # new branch or force-push
            else
              BASE=""
            fi
          fi
          if [ -n "$BASE" ]; then RANGE="$BASE..$HEAD"; else RANGE="--max-count=1 $HEAD"; fi

          RULES="$RUNNER_TEMP/gitleaks-rules"
          mkdir -p "$RULES"
          if [ -n "$BASE" ] && git cat-file -e "$BASE:.gitleaks.toml" 2>/dev/null; then
            git show "$BASE:.gitleaks.toml" > "$RULES/gitleaks.toml"
            git show "$BASE:.gitleaksignore" > "$RULES/.gitleaksignore" 2>/dev/null || : > "$RULES/.gitleaksignore"
            echo "Rules: .gitleaks.toml and .gitleaksignore from base $BASE"
          else
            cp .gitleaks.toml "$RULES/gitleaks.toml"
            cp .gitleaksignore "$RULES/.gitleaksignore" 2>/dev/null || : > "$RULES/.gitleaksignore"
            echo "Rules: base has no .gitleaks.toml, using this change's own"
          fi
          # gitleaks also reads .gitleaksignore from the folder it scans, on top
          # of --gitleaks-ignore-path. Remove the checked-out copy so only the
          # one chosen above applies.
          rm -f .gitleaksignore

          echo "Gitleaks log range: $RANGE"
          echo "GITLEAKS_RANGE=$RANGE" >> "$GITHUB_ENV"
          echo "GITLEAKS_RULES=$RULES" >> "$GITHUB_ENV"

      # Catches a secret added and then removed again inside the pushed
      # commits: it is gone from the files but still in git history.
      - name: Scan pushed commits
        run: |
          # shellcheck disable=SC2086 # GITLEAKS_FLAGS is a list of flags
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" -v "$GITLEAKS_RULES:/rules:ro" -v "$RUNNER_TEMP:/out" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS_IMAGE" git . --log-opts="$GITLEAKS_RANGE" \
              --config /rules/gitleaks.toml --gitleaks-ignore-path /rules $GITLEAKS_FLAGS \
              --report-format sarif --report-path /out/gitleaks-commits.sarif

      - name: Scan commit messages
        if: always()
        run: |
          # shellcheck disable=SC2086
          git log --format=%B $GITLEAKS_RANGE | docker run --rm -i \
            -v "$GITLEAKS_RULES:/rules:ro" \
            "$GITLEAKS_IMAGE" stdin --config /rules/gitleaks.toml $GITLEAKS_FLAGS

      # Scans whole files, not only changed lines: a password pasted into an
      # existing Postman "value" leaves its "key" line out of the diff.
      - name: Scan files at this commit
        if: always()
        run: |
          # shellcheck disable=SC2086
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" -v "$GITLEAKS_RULES:/rules:ro" -v "$RUNNER_TEMP:/out" -w /repo \
            "$GITLEAKS_IMAGE" dir . \
              --config /rules/gitleaks.toml --gitleaks-ignore-path /rules $GITLEAKS_FLAGS \
              --report-format sarif --report-path /out/gitleaks-files.sarif

      - name: Upload Gitleaks reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-*.sarif
          if-no-files-found: ignore
