[server_setup]
username = <databroker-user>
password = <databroker-password>
host = v2.dev.iudx.io
port = 24567
vhost = IUDX-V2-INTERNAL

; AMQP TLS. The dev broker's cert is issued for localhost, so the
; chain is verified but the hostname is not. An environment with a
; correctly-issued cert should set check_hostname = true.
cert_path = ./rabbitmq-ca.crt
check_hostname = false

; Management API. Proxied at a path here, but may be a host:port
; elsewhere - give whatever the base URL actually is.
; mgmt_verify = false is the equivalent of curl -k.
mgmt_url = https://v2.dev.iudx.io/databroker
mgmt_verify = true

[queue]
name = <item-id>

[api]
url = https://dummyjson.com/users
results_key = users

[delete]
user = <token-sub>
