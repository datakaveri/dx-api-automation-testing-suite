[kibana]
host = https://v2.dev.iudx.io/kibana
username = <username>
password = ${NGSILD_KIBANA_PASSWORD}

[rabbitmq]
host = v2.dev.iudx.io
port = 24567
username = automation-admin
password = ${NGSILD_RABBITMQ_PASSWORD}
vhost = IUDX-V2
cert_path = ./rabbitmq-ca.crt

; false accepts a certificate whose subject does not match the broker
; hostname (this broker's is issued for localhost); the certificate
; chain is verified either way. Set true wherever the cert is correct.
check_hostname = false

; exchange_name / delete_user come from the collection run via post-run.json
; (--exchange / --delete-user); set them here only for a manual run.

queue_name = database
mgmt_url = https://v2.dev.iudx.io/databroker

; --- optional, shown with their defaults --------------------
; index_prefix = iudx-v2__
; mgmt_verify  = true          ; true, false, or a path to a CA file