services:
  backend:
    container_name: iudxqa-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV:-development}
      DB_SYNC: ${DB_SYNC:-alter}
      PORT: 4000
      COLLECTIONS_DIR: ${COLLECTIONS_DIR:-collections}
      RESULTS_FILE: ${RESULTS_FILE:-/app/data/results.json}
      CONTROL_PLANE_PASSWORD_FILE: ${CONTROL_PLANE_PASSWORD_FILE:-/app/data/control-plane-password.json}
      POST_RUN_VENV_ROOT: ${POST_RUN_VENV_ROOT:-/opt/post-run-venvs}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:8080,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:8080,http://localhost:5173}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:8080}
      AUTO_RERUN_ON_STARTUP: ${AUTO_RERUN_ON_STARTUP:-false}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_API_AUDIENCE: ${KEYCLOAK_API_AUDIENCE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      QA_RECIPIENTS: ${QA_RECIPIENTS:-}
    volumes:
      - backend_data:/app/data
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: iudxqa-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  backend_data:
